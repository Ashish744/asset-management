<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Create Account — STACKLY</title>
<meta name="description" content="Create a STACKLY account."/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="login-wrap">
  <aside class="login-side">
    <a href="index.html" class="brand-link"><img src="logo-dark-themed%20(1).webp" alt="STACKLY" class="brand"/></a>
    <div>
      <h2>Create your STACKLY account.</h2>
      <p>Set up your profile to access portfolios, messages, and research.</p>
    </div>
    <div style="opacity:.7;font-size:.85rem;position:relative;z-index:2">© <span data-year></span> STACKLY. Secure client access.</div>
  </aside>
  <main class="login-form">
    <div class="login-top">
      <a href="./index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back to home</a>
    </div>
    <h2 class="form-title">Create Account</h2>
    <p class="form-sub">Choose a role and complete the form below.</p>
    <form id="registerForm" novalidate>
      <div class="field"><label>Full name</label><input id="regName" type="text" required pattern="^[A-Za-zÀ-ÖØ-öø-ÿ '\\-]+$" title="Use letters, spaces, apostrophes or hyphens only" placeholder="Jane Doe"/></div>
      <div class="field"><label for="roleButtons">Role</label>
        <div id="roleButtonsReg" class="role-buttons" role="group" aria-label="Select role">
          <button type="button" class="btn role-btn active" data-role="user">User</button>
          <button type="button" class="btn role-btn" data-role="admin">Admin</button>
        </div>
        <input type="hidden" id="regRole" name="role" value="user" required>
      </div>
      <div class="field"><label>Email</label><input id="regEmail" type="email" required placeholder="you@example.com"/></div>
      <div class="field password-field">
        <label>Password</label>
        <div class="pw-row">
          <input id="regPassword" type="password" required placeholder="Choose a password"/>
          <button type="button" class="pw-toggle" data-target="regPassword" aria-label="Show password">Show</button>
        </div>
      </div>
      <div class="field password-field">
        <label>Confirm password</label>
        <div class="pw-row">
          <input id="regPasswordConfirm" type="password" required placeholder="Confirm password"/>
          <button type="button" class="pw-toggle" data-target="regPasswordConfirm" aria-label="Show password">Show</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Create account</button>
      <div class="form-error" aria-live="polite"></div>
      <p class="form-alt" style="margin-top:18px">Already have an account? <a href="./login.html">Sign in</a></p>
    </form>
  </main>
</div>
<script src="./js/main.js"></script>
</body>
</html>
